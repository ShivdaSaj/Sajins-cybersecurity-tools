# Deploy with Hostinger Docker Manager (project name: cybersecuritytools).
# No image build needed: stock nginx:alpine pulls the site files from GitHub
# at start-up (SITE_REF branch), and sync-readme.sh keeps the tool list fresh.
# Routed over HTTPS by the existing Traefik instance (Let's Encrypt).
services:
  cybersecuritytools:
    image: nginx:1.27-alpine
    container_name: cybersecuritytools
    restart: unless-stopped
    environment:
      - SITE_REF=${SITE_REF:-main}
      - README_URL=https://raw.githubusercontent.com/ShivdaSaj/Sajins-cybersecurity-tools/main/README.md
      - SYNC_INTERVAL=21600
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BASE="https://raw.githubusercontent.com/ShivdaSaj/Sajins-cybersecurity-tools/$${SITE_REF}/web"
        H=/usr/share/nginx/html
        mkdir -p "$$H/data"
        wget -q -T 30 -O /etc/nginx/conf.d/default.conf "$$BASE/nginx.conf"
        wget -q -T 30 -O /etc/nginx/security-headers.conf "$$BASE/security-headers.conf"
        wget -q -T 30 -O /docker-entrypoint.d/90-sync-readme.sh "$$BASE/sync-readme.sh"
        wget -q -T 30 -O "$$H/index.html.tmp" "$$BASE/site/index.html"
        mv "$$H/index.html.tmp" "$$H/index.html"
        chmod +x /docker-entrypoint.d/90-sync-readme.sh
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.cybersecuritytools.rule=Host(`cybersecuritytools.sajinshivdas.online`)
      - traefik.http.routers.cybersecuritytools.entrypoints=websecure
      - traefik.http.routers.cybersecuritytools.tls=true
      - traefik.http.routers.cybersecuritytools.tls.certresolver=letsencrypt
      - traefik.http.services.cybersecuritytools.loadbalancer.server.port=80
