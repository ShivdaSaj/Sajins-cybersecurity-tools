# Deploy with Hostinger Docker Manager (project name: cybersecuritytools).
# No image build needed: the stock Node image downloads the site code from GitHub
# (branch SITE_REF) at start-up and runs the server + admin panel.
# With GITHUB_REPO + GITHUB_TOKEN set, the code comes from that (private) reference repository
# and the catalog is kept in two-way sync with it; otherwise the public repository is used.
# Catalog, settings, backups and the admin password hash live in the named volume.
# Routed over HTTPS by the existing Traefik instance (Let's Encrypt).
#
# Environment variables (set them in Docker Manager, never commit them):
#   ADMIN_PASSWORD   initial admin password (can be changed later in the admin panel)
#   GITHUB_REPO      reference repository, e.g. ShivdaSaj/Sajin-Cybersecurity-Resources
#   GITHUB_TOKEN     fine-grained token for that repository only, "Contents: Read and write"
#   SITE_REF         branch to deploy (default main)
services:
  cybersecuritytools:
    image: node:22-alpine
    container_name: cybersecuritytools
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/data
      - RUN_AS_UID=1000
      - SITE_REF=${SITE_REF:-main}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
    volumes:
      - cybersecuritytools-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /data /tmp/src
        if [ -n "$${GITHUB_TOKEN}" ] && [ -n "$${GITHUB_REPO}" ]; then
          export SRC="https://api.github.com/repos/$${GITHUB_REPO}/tarball/$${SITE_REF}"
        else
          export SRC="https://codeload.github.com/ShivdaSaj/Sajins-cybersecurity-tools/tar.gz/refs/heads/$${SITE_REF}"
        fi
        if node -e '
          const h = { "User-Agent": "cybersecuritytools-deploy" };
          if (process.env.GITHUB_TOKEN && process.env.GITHUB_REPO) h.Authorization = "Bearer " + process.env.GITHUB_TOKEN;
          fetch(process.env.SRC, { headers: h, signal: AbortSignal.timeout(90000) })
            .then(async (r) => { if (!r.ok) throw new Error("HTTP " + r.status); require("fs").writeFileSync("/tmp/site.tgz", Buffer.from(await r.arrayBuffer())); })
            .catch((e) => { console.error("download failed: " + e.message); process.exit(1); });
        '; then
          echo "Site code downloaded from $$SRC"
          cp /tmp/site.tgz /data/.site-cache.tgz
        elif [ -f /data/.site-cache.tgz ]; then
          echo "GitHub unreachable, using cached site code"
          cp /data/.site-cache.tgz /tmp/site.tgz
        else
          echo "Cannot download site code from $$SRC" >&2
          exit 1
        fi
        tar -xzf /tmp/site.tgz -C /tmp/src
        mkdir -p /app
        cp -r /tmp/src/*/. /app/
        chown -R 1000:1000 /data
        exec node /app/web/server/server.mjs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.cybersecuritytools.rule=Host(`cybersecuritytools.sajinshivdas.online`)
      - traefik.http.routers.cybersecuritytools.entrypoints=websecure
      - traefik.http.routers.cybersecuritytools.tls=true
      - traefik.http.routers.cybersecuritytools.tls.certresolver=letsencrypt
      - traefik.http.services.cybersecuritytools.loadbalancer.server.port=8080

volumes:
  cybersecuritytools-data:
