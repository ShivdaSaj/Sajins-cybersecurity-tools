server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/security-headers.conf; }

    location /data/ {
        types { text/markdown md; }
        charset utf-8;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
