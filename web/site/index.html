<!doctype html>
<html lang="en" {{HTMLATTRS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="{{THEMECOLOR}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/icons.svg" as="image" type="image/svg+xml">
<link rel="stylesheet" href="assets/themes.css">
<script src="assets/theme-init.js"></script>
<style>
:root{--mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;--r-sm:10px;--radius:14px;--r-lg:16px}
:root[data-font="mono"]{--sans:var(--mono)}
:root[data-font="rounded"]{--sans:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif}
:root[data-font="serif"]{--sans:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,Cambria,serif}
:root[data-radius="sharp"]{--r-sm:3px;--radius:4px;--r-lg:4px}
:root[data-radius="round"]{--r-sm:14px;--radius:22px;--r-lg:26px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* background */
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
.glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:var(--glow-op,.28);transition:background .4s}
.glow.a{width:520px;height:520px;background:var(--accent2);top:-200px;left:-160px}
.glow.b{width:480px;height:480px;background:var(--accent);top:30vh;right:-220px;opacity:calc(var(--glow-op,.28) * .58)}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand img{width:28px;height:28px;flex:none}
.brand>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s,background .15s;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.icon{width:36px;padding:0;justify-content:center}

/* hero */
.hero{padding:48px 0 18px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);padding:7px 12px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:999px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-size:clamp(30px,5.4vw,58px);line-height:1.05;margin:18px auto 12px;letter-spacing:-1.2px;max-width:900px}
h1 .grad{background:linear-gradient(92deg,var(--accent),var(--accent2) 60%,var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--muted);max-width:720px;margin:0 auto;font-size:clamp(15px,1.8vw,17px)}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0 6px}
.stat{min-width:120px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.stat b{display:block;font:700 24px/1.1 var(--mono);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}

/* search */
.searchbox{position:sticky;top:60px;z-index:15;margin-inline:calc(50% - 50vw);padding:14px calc(50vw - 50%) 14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-bottom:12px}
.search{position:relative;max-width:860px;margin:0 auto}
.search svg.mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:56px;padding:0 112px 0 52px;border-radius:var(--r-lg);border:1px solid var(--line2);background:var(--panel-solid);font-size:17px;box-shadow:var(--shadow),0 0 0 0 transparent;transition:box-shadow .2s,border-color .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search input::placeholder{color:var(--dim)}
.search .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;color:var(--dim);font:12px var(--mono)}
kbd{font:600 11px var(--mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line2);background:var(--bg2);color:var(--muted)}
#clear{display:none;border:0;background:var(--bg2);border-radius:var(--r-sm);cursor:pointer;color:var(--muted);width:30px;height:30px;font-size:15px}#clear:hover{color:var(--text)}
.has-q #clear{display:block}.has-q .kbd kbd{display:none}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
select.sel{height:33px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--panel);padding:0 10px;font-size:13px;color:var(--muted)}

/* layout */
.main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding:10px 0 60px}
aside.cats{position:sticky;top:206px;align-self:start;max-height:calc(100vh - 222px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.cats h3{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:16px 8px 8px}
.cat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--r-sm);padding:7px 8px;cursor:pointer;color:var(--muted);font-size:14px;transition:background .12s,color .12s}
.cat:hover{background:var(--panel);color:var(--text)}
.cat[aria-pressed="true"]{background:var(--panel);border-color:var(--line2);color:var(--text)}
.cat .dot{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;background:hsl(var(--h) 90% 60% / .16);color:hsl(var(--h) 95% 70%)}
:root[data-mode="light"] .cat .dot{color:hsl(var(--h) 70% 38%)}
.cat .dot svg{width:14px;height:14px}
.cat .n{margin-left:auto;font:12px var(--mono);color:var(--dim)}
.cat .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.resultbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px;color:var(--muted);font-size:14px}
.resultbar b{color:var(--text);font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

section.group{margin-bottom:30px;content-visibility:auto;contain-intrinsic-size:auto 600px}
.ghead{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ghead .dot{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 90% 55% / .28),hsl(calc(var(--h) + 40) 90% 55% / .12));color:hsl(var(--h) 95% 72%);border:1px solid hsl(var(--h) 90% 60% / .35)}
:root[data-mode="light"] .ghead .dot{color:hsl(var(--h) 70% 36%)}
.ghead .dot svg{width:18px;height:18px}
.ghead h2{font-size:19px;margin:0;letter-spacing:-.2px}
.ghead .cnt{font:12px var(--mono);color:var(--dim);padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.ghead a.src{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ghead a.src:hover{color:var(--accent)}
.ghead a.src svg{width:14px;height:14px}
.sub{font:600 12px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}

.main>div{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 14px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,hsl(var(--h) 95% 60%),transparent);opacity:.7}
.card:hover{transform:translateY(-2px);border-color:hsl(var(--h) 90% 60% / .55);box-shadow:var(--shadow),0 0 0 1px hsl(var(--h) 90% 60% / .15),0 12px 40px -18px hsl(var(--h) 90% 55% / .55)}
.card .hd{display:flex;align-items:center;gap:10px;min-width:0}
.ico{width:32px;height:32px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;background:hsl(var(--h) 80% 55% / .14);border:1px solid var(--line);overflow:hidden;font:700 13px var(--mono);color:hsl(var(--h) 95% 72%)}
:root[data-mode="light"] .ico{color:hsl(var(--h) 70% 36%)}
.ico img{width:20px;height:20px;border-radius:4px}
.ico.gh img{width:32px;height:32px;border-radius:0}
.card h4{margin:0;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card h4 a::after{content:"";position:absolute;inset:0;z-index:1}
.card .host{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.card p code{font:12px var(--mono);padding:1px 5px;border-radius:5px;background:var(--bg2);color:var(--text)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.tag{font:600 10.5px/1 var(--mono);padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);letter-spacing:.3px}
.tag.free{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.tag.paid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.tag.cat{border-style:dashed}
.more{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px}
.more a{font:11.5px var(--mono);color:var(--accent);border-bottom:1px dotted}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.empty{text-align:center;padding:60px 16px;border:1px dashed var(--line2);border-radius:var(--radius);color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--text);margin-bottom:6px}
.notice{display:flex;gap:12px;align-items:flex-start;max-width:860px;margin:18px auto 0;padding:12px 14px;border-radius:var(--r-sm);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent);color:var(--muted);font-size:13px;text-align:left}
.notice svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.notice button{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}

/* footer */
.sfoot{container:sfoot/inline-size;position:relative;z-index:1;padding:26px 0 34px;color:var(--muted);font-size:14px}
.sfoot[hidden]{display:none}
.fpanel{position:relative;border-radius:calc(var(--r-lg) + 8px);border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 7%,var(--panel)),var(--panel) 45%,color-mix(in srgb,var(--accent) 9%,var(--panel)));box-shadow:var(--shadow);padding:40px 40px 26px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fpanel::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent) 55%,var(--accent3,var(--accent)))}
.fpanel::after{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%);pointer-events:none}
.fgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,2fr) minmax(0,1.1fr);gap:32px 40px;align-items:start}
.fgrid.nosub{grid-template-columns:minmax(0,1.25fr) minmax(0,2fr)}
.fgrid.nocols{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr)}
.fgrid.nosub.nocols{grid-template-columns:minmax(0,1fr)}
.fname{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.2;background:linear-gradient(92deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;max-width:100%}
.fabout{margin:14px 0 0;line-height:1.75;font-size:15px;max-width:420px}
.fsocial{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.fsocial a{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--panel-solid);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .15s,border-color .15s,color .15s,box-shadow .15s}
.fsocial a:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent);box-shadow:0 8px 20px -10px var(--accent)}
.fsocial svg{width:21px;height:21px}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:28px}
.fcol h4{margin:4px 0 18px;font:700 12.5px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.fcol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.fcol a{color:var(--text);opacity:.86;font-size:15.5px;transition:color .15s,opacity .15s,padding .15s}
.fcol a:hover{color:var(--accent);opacity:1;padding-left:3px}
.fsub{position:relative;padding:22px;border-radius:var(--r-lg);border:1px solid var(--line2);background:color-mix(in srgb,var(--panel-solid) 82%,transparent);box-shadow:0 10px 30px -18px rgba(0,0,0,.4)}
.fsub h3{margin:0 0 16px;font-size:17px;line-height:1.45;color:var(--text)}
.fsub input{width:100%;height:46px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--bg2);padding:0 14px;font-size:15px}
.fsub input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.fsub input::placeholder{color:var(--dim)}
.fsub input.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fsub button{width:100%;height:46px;margin-top:12px;border:0;border-radius:var(--r-sm);cursor:pointer;font-weight:700;font-size:15.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 10px 24px -12px var(--accent2);transition:filter .15s,transform .15s}
.fsub button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fsub button:disabled{opacity:.6;cursor:progress}
.fsubmsg{margin:10px 0 0;font-size:13px;min-height:0}
.fsubmsg:empty{display:none}
.fsubmsg.ok{color:var(--good)}.fsubmsg.bad{color:var(--bad,#f55)}
.fbottom{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.fbottom.solo{margin-top:0;padding-top:0;border-top:0}
.fleft{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 380px}
.fcopy{color:var(--text);opacity:.9;font-size:15px}
.fnote,.fmeta{font-size:13px;color:var(--muted)}
.fnote a,.fmeta a{color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.fnote a:hover,.fmeta a:hover{color:var(--accent)}
.fmeta{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.fmeta>span:empty{display:none}
.flinks{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;flex:0 1 auto}
.flinks a{padding:2px 16px;font-size:15px;color:var(--muted);border-left:1px solid var(--line2);transition:color .15s}
.flinks a:first-child{border-left:0}
.flinks a:last-child{padding-right:0}
.flinks a:hover{color:var(--accent)}
/* footer styles */
.sfoot[data-style="flat"] .fpanel{border-radius:0;border-width:1px 0 0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:40px 0 10px}
.sfoot[data-style="flat"] .fpanel::after{display:none}
.sfoot[data-style="minimal"] .fpanel{border:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:22px 0 0;border-top:1px solid var(--line);border-radius:0}
.sfoot[data-style="minimal"] .fpanel::before,.sfoot[data-style="minimal"] .fpanel::after{display:none}
.sfoot[data-style="minimal"] .fname{font-size:19px}
.sfoot[data-style="minimal"] .fsocial a{width:36px;height:36px}
@container sfoot (max-width: 1080px){
  .fgrid,.fgrid.nocols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fgrid .fcols{grid-column:1/-1;grid-row:2}
  .fgrid.nosub .fcols{grid-column:auto;grid-row:auto}
}
@container sfoot (max-width: 700px){
  .fpanel{padding:28px 20px 20px}
  .fgrid,.fgrid.nosub,.fgrid.nocols{grid-template-columns:minmax(0,1fr)}
  .fgrid .fcols,.fgrid.nosub .fcols{grid-column:auto;grid-row:auto}
  .fcols{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  .fbottom{flex-direction:column;align-items:flex-start}
  .fleft{flex-basis:auto}
  .flinks{justify-content:flex-start;gap:8px 20px}.flinks a{padding:0;border:0;font-size:14px}
  .fname{font-size:23px}
}
.skeleton{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,var(--panel) 0%,var(--bg2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#totop{position:fixed;right:16px;bottom:16px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#totop.show{opacity:1;pointer-events:auto}
#catToggle{display:none}

@media (max-width: 980px){
  .main{grid-template-columns:minmax(0,1fr)}
  aside.cats{position:static;max-height:none;overflow:visible;display:none}
  aside.cats.open{display:block}
  .cats .list{display:flex;flex-wrap:wrap;gap:6px}
  .cats .cat{width:auto;border-color:var(--line);background:var(--panel)}
  .cats .cat .n{margin-left:4px}
  #catToggle{display:inline-flex}
  .searchbox{top:60px}
}
@media (max-width: 600px){
  .hero{padding-top:30px}
  .brand small,.hide-sm{display:none}
  .search input{height:50px;font-size:16px;padding-right:48px}
  .search .kbd kbd{display:none}
  .grid{grid-template-columns:1fr}
  .ghead a.src span{display:none}
  .stat{min-width:0;flex:1 1 40%}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}#net{display:none}}

/* hero orbit animation */

.o-ripple{position:absolute;inset:35%;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent);opacity:0;animation:o-ripple 3.6s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.o-ripple.o-d2{animation-delay:1.2s}.o-ripple.o-d3{animation-delay:2.4s}
.o-core{position:absolute;z-index:2;inset:35%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 22%,var(--panel-solid)),var(--panel-solid) 70%);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 6%,transparent),0 0 60px -6px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 0 30px -10px var(--accent);animation:o-breathe 3.6s ease-in-out infinite}

.o-chips{position:absolute;inset:0}

.o-chip>span{display:inline-flex;align-items:center;gap:8px;max-width:170px;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--panel-solid) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);animation:o-float 6s ease-in-out infinite,o-lit var(--T) linear infinite;animation-delay:var(--fd,0s),var(--ld,0s);transition:border-color .2s,transform .2s}

      <div class="o-chips" id="oChips"></div>
    </div>
    <div class="notice" id="legal" hidden>
      <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
      <div><b style="color:var(--text)">Legal &amp; ethical use.</b> <span id="legalText"></span></div>
      <button id="legalX" aria-label="Dismiss notice">×</button>
    </div>
  </section>

  <div class="searchbox">
    <div class="search" id="searchWrap">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g></svg>
      <label for="q" class="sr">Search</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search…">
      <div class="kbd"><kbd>/</kbd><button id="clear" aria-label="Clear search">✕</button></div>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Section" id="fKind"></div>
      <div class="seg" role="group" aria-label="Licence" id="fLic">
        <button data-v="" aria-pressed="true">Any licence</button>
        <button data-v="F" aria-pressed="false">Free</button>
        <button data-v="C" aria-pressed="false">Commercial</button>
      </div>
      <div class="seg" role="group" aria-label="Platform" id="fOs">
        <button data-v="" aria-pressed="true">Any OS</button>
        <button data-v="Linux" aria-pressed="false">Linux</button>
        <button data-v="macOS" aria-pressed="false">macOS</button>
        <button data-v="Windows" aria-pressed="false">Windows</button>
      </div>
      <button class="btn" id="catToggle" aria-expanded="false" aria-controls="cats" style="height:33px">Categories</button>
      <label class="sr" for="sort">Sort</label>
      <select class="sel" id="sort"><option value="cat">Group by category</option><option value="rel">Best match</option><option value="az">A → Z</option></select>
    </div>
  </div>

  <div class="main">
    <aside class="cats" id="cats" aria-label="Categories"></aside>
    <div>
      <div class="resultbar" id="rbar" aria-live="polite"></div>
      <div id="results"><div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
    </div>
  </div>
</main>

<footer id="siteFoot" class="sfoot" data-style="card">
  <div class="wrap">
    <div class="fpanel">
      <div class="fgrid" id="fGrid">
        <div class="fbrand">
          <div class="fname" id="fBrand"></div>
          <p class="fabout" id="fAbout"></p>
          <div class="fsocial" id="fSocial"></div>
        </div>
        <div class="fcols" id="fCols"></div>
        <form class="fsub" id="fSub" novalidate>
          <h3 id="fSubTitle"></h3>
          <label class="sr" for="fSubEmail">Email address</label>
          <input type="email" id="fSubEmail" name="email" autocomplete="email" required maxlength="200">
          <input type="text" name="company" id="fSubHp" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
          <button type="submit" id="fSubBtn"></button>
          <p class="fsubmsg" id="fSubMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
      <div class="fbottom">
        <div class="fleft">
          <div class="fcopy" id="fCopy"></div>
          <div class="fnote" id="fNote"></div>
          <div class="fmeta" id="fMeta">
            <span class="dl" id="fDl">Download list: <a href="catalog.md" download><svg><use href="assets/icons.svg#i-dl"/></svg>Markdown</a> · <a href="catalog.yaml" download><svg><use href="assets/icons.svg#i-dl"/></svg>YAML</a></span>
            <span id="synced"></span>
            <span id="fLegend">Tags: <span class="tag free">FREE</span> open source / free · <span class="tag paid">PAID</span> commercial tier</span>
          </div>
        </div>
        <nav class="flinks" id="fLinks" aria-label="Footer"></nav>
      </div>
    </div>
  </div>
</footer>
<button class="btn icon" id="totop" aria-label="Back to top">↑</button>
</body>
</html>
