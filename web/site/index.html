<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#05080f">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/icons.svg" as="image" type="image/svg+xml">
<style>
:root{
  --bg:#05080f;--bg2:#0a1020;--panel:rgba(14,22,40,.72);--panel-solid:#0e1628;--line:rgba(120,160,255,.14);--line2:rgba(120,160,255,.28);
  --text:#e6edf7;--muted:#8b9ab5;--dim:#5d6b85;--accent:#00f0ff;--accent2:#7c4dff;--good:#2ee59d;--warn:#ffb547;--mark:rgba(0,240,255,.22);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);--radius:14px;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f7fc;--bg2:#e9eef8;--panel:rgba(255,255,255,.82);--panel-solid:#fff;--line:rgba(30,60,120,.12);--line2:rgba(30,60,120,.24);
  --text:#0d1726;--muted:#4a5872;--dim:#7a879d;--accent:#0077d9;--accent2:#6a3df0;--good:#0e9f62;--warn:#b86e00;--mark:rgba(0,119,217,.16);
  --shadow:0 10px 26px -14px rgba(20,40,90,.35);color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f7fc;--bg2:#e9eef8;--panel:rgba(255,255,255,.82);--panel-solid:#fff;--line:rgba(30,60,120,.12);--line2:rgba(30,60,120,.24);
    --text:#0d1726;--muted:#4a5872;--dim:#7a879d;--accent:#0077d9;--accent2:#6a3df0;--good:#0e9f62;--warn:#b86e00;--mark:rgba(0,119,217,.16);
    --shadow:0 10px 26px -14px rgba(20,40,90,.35);color-scheme:light;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* background */
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
.glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.28}
.glow.a{width:520px;height:520px;background:var(--accent2);top:-200px;left:-160px}
.glow.b{width:480px;height:480px;background:var(--accent);top:30vh;right:-220px;opacity:.16}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand img{width:28px;height:28px;flex:none}
.brand>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s,background .15s;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.icon{width:36px;padding:0;justify-content:center}

/* hero */
.hero{padding:48px 0 18px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);padding:7px 12px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:999px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-size:clamp(30px,5.4vw,58px);line-height:1.05;margin:18px auto 12px;letter-spacing:-1.2px;max-width:900px}
h1 .grad{background:linear-gradient(92deg,var(--accent),var(--accent2) 60%,#ff4dd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--muted);max-width:720px;margin:0 auto;font-size:clamp(15px,1.8vw,17px)}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0 6px}
.stat{min-width:120px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stat b{display:block;font:700 24px/1.1 var(--mono);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}

/* search */
.searchbox{position:sticky;top:60px;z-index:15;margin-inline:calc(50% - 50vw);padding:14px calc(50vw - 50%) 14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-bottom:12px}
.search{position:relative;max-width:860px;margin:0 auto}
.search svg.mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:56px;padding:0 112px 0 52px;border-radius:16px;border:1px solid var(--line2);background:var(--panel-solid);font-size:17px;box-shadow:var(--shadow),0 0 0 0 transparent;transition:box-shadow .2s,border-color .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search input::placeholder{color:var(--dim)}
.search .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;color:var(--dim);font:12px var(--mono)}
kbd{font:600 11px var(--mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line2);background:var(--bg2);color:var(--muted)}
#clear{display:none;border:0;background:var(--bg2);border-radius:8px;cursor:pointer;color:var(--muted);width:30px;height:30px;font-size:15px}#clear:hover{color:var(--text)}
.has-q #clear{display:block}.has-q .kbd kbd{display:none}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
select.sel{height:33px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);padding:0 10px;font-size:13px;color:var(--muted)}

/* layout */
.main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding:10px 0 60px}
aside.cats{position:sticky;top:206px;align-self:start;max-height:calc(100vh - 222px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.cats h3{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:16px 8px 8px}
.cat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;color:var(--muted);font-size:14px;transition:background .12s,color .12s}
.cat:hover{background:var(--panel);color:var(--text)}
.cat[aria-pressed="true"]{background:var(--panel);border-color:var(--line2);color:var(--text)}
.cat .dot{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;background:hsl(var(--h) 90% 60% / .16);color:hsl(var(--h) 95% 70%)}
:root[data-theme="light"] .cat .dot{color:hsl(var(--h) 70% 38%)}
.cat .dot svg{width:14px;height:14px}
.cat .n{margin-left:auto;font:12px var(--mono);color:var(--dim)}
.cat .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.resultbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px;color:var(--muted);font-size:14px}
.resultbar b{color:var(--text);font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

section.group{margin-bottom:30px;content-visibility:auto;contain-intrinsic-size:auto 600px}
.ghead{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ghead .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 90% 55% / .28),hsl(calc(var(--h) + 40) 90% 55% / .12));color:hsl(var(--h) 95% 72%);border:1px solid hsl(var(--h) 90% 60% / .35)}
:root[data-theme="light"] .ghead .dot{color:hsl(var(--h) 70% 36%)}
.ghead .dot svg{width:18px;height:18px}
.ghead h2{font-size:19px;margin:0;letter-spacing:-.2px}
.ghead .cnt{font:12px var(--mono);color:var(--dim);padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.ghead a.src{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ghead a.src:hover{color:var(--accent)}
.ghead a.src svg{width:14px;height:14px}
.sub{font:600 12px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}

.main>div{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 14px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,hsl(var(--h) 95% 60%),transparent);opacity:.7}
.card:hover{transform:translateY(-2px);border-color:hsl(var(--h) 90% 60% / .55);box-shadow:var(--shadow),0 0 0 1px hsl(var(--h) 90% 60% / .15),0 12px 40px -18px hsl(var(--h) 90% 55% / .55)}
.card .hd{display:flex;align-items:center;gap:10px;min-width:0}
.ico{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:hsl(var(--h) 80% 55% / .14);border:1px solid var(--line);overflow:hidden;font:700 13px var(--mono);color:hsl(var(--h) 95% 72%)}
:root[data-theme="light"] .ico{color:hsl(var(--h) 70% 36%)}
.ico img{width:20px;height:20px;border-radius:4px}
.ico.gh img{width:32px;height:32px;border-radius:0}
.card h4{margin:0;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card h4 a::after{content:"";position:absolute;inset:0;z-index:1}
.card .host{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.card p code{font:12px var(--mono);padding:1px 5px;border-radius:5px;background:var(--bg2);color:var(--text)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.tag{font:600 10.5px/1 var(--mono);padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);letter-spacing:.3px}
.tag.free{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.tag.paid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.tag.cat{border-style:dashed}
.more{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px}
.more a{font:11.5px var(--mono);color:var(--accent);border-bottom:1px dotted}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.empty{text-align:center;padding:60px 16px;border:1px dashed var(--line2);border-radius:var(--radius);color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--text);margin-bottom:6px}
.notice{display:flex;gap:12px;align-items:flex-start;max-width:860px;margin:18px auto 0;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent);color:var(--muted);font-size:13px;text-align:left}
.notice svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.notice button{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
footer a{color:var(--accent)}
.skeleton{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,var(--panel) 0%,var(--bg2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#totop{position:fixed;right:16px;bottom:16px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#totop.show{opacity:1;pointer-events:auto}
#catToggle{display:none}

@media (max-width: 980px){
  .main{grid-template-columns:minmax(0,1fr)}
  aside.cats{position:static;max-height:none;overflow:visible;display:none}
  aside.cats.open{display:block}
  .cats .list{display:flex;flex-wrap:wrap;gap:6px}
  .cats .cat{width:auto;border-color:var(--line);background:var(--panel)}
  .cats .cat .n{margin-left:4px}
  #catToggle{display:inline-flex}
  .searchbox{top:60px}
}
@media (max-width: 600px){
  .hero{padding-top:30px}
  .brand small,.hide-sm{display:none}
  .search input{height:50px;font-size:16px;padding-right:48px}
  .search .kbd kbd{display:none}
  .grid{grid-template-columns:1fr}
  .ghead a.src span{display:none}
  .stat{min-width:0;flex:1 1 40%}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}#net{display:none}}

/* clock */
.clockwrap{position:relative}
.clock{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.clock:hover{border-color:var(--accent)}
.clock svg{width:15px;height:15px;color:var(--accent);flex:none}
.clock .ct{font:700 15px/1 var(--mono);color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.clock .cd{font-size:12.5px}
.clock .cz{font:600 11px/1 var(--mono);padding:4px 6px;border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));z-index:40;padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--panel-solid);box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
.pop h3{margin:0 0 2px;font-size:14px}
.pop .big{font:700 30px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin:6px 0 2px}
.pop .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.pop input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);padding:0 12px;font-size:14px}
.pop input:focus{outline:none;border-color:var(--accent)}
.tzlist{max-height:240px;overflow:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px}
.tzlist button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:none;padding:7px 10px;cursor:pointer;font-size:13px;text-align:left;color:var(--text)}
.tzlist button:hover,.tzlist button:focus-visible{background:var(--bg2)}
.tzlist button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tzlist small{font:11.5px var(--mono);color:var(--dim);white-space:nowrap}
.pop .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pop .btn{height:32px;font-size:12.5px}
.pop label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-left:auto}
footer .dl a{display:inline-flex;gap:5px;align-items:center}
footer .dl svg{width:13px;height:13px}
@media (max-width: 760px){.clock .cd{display:none}}
@media (max-width: 420px){.clock{padding:0 9px;gap:7px}.clock svg{display:none}.brand{font-size:14px;gap:8px}.brand>span{max-width:128px;white-space:nowrap}.bar{gap:8px}}
</style>
<style id="accentStyle"></style>
<script id="boot" type="application/json"><!--BOOT--></script>
<script src="assets/app.js" defer></script>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<div class="glow a" aria-hidden="true"></div><div class="glow b" aria-hidden="true"></div>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="./" id="brand">
      <img src="assets/favicon.svg" alt="" width="28" height="28">
      <span><span id="brandName">Cybersecurity Tools</span><small id="brandTag"></small></span>
    </a>
    <div class="spacer"></div>
    <div class="clockwrap" id="clockWrap" hidden>
      <button class="clock" id="clockBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="tzPop" title="Change time zone">
        <svg><use href="assets/icons.svg#i-clock"/></svg><span class="ct" id="cTime">--:--</span><span class="cd" id="cDate"></span><span class="cz" id="cZone"></span>
      </button>
      <div class="pop" id="tzPop" role="dialog" aria-label="Time zone" hidden>
        <h3>Current time</h3>
        <div class="big" id="pTime"></div>
        <div class="meta" id="pMeta"></div>
        <div id="tzPick">
          <label class="sr" for="tzSearch">Search time zones</label>
          <input id="tzSearch" type="search" placeholder="Search city or zone, e.g. Dubai, London, UTC" autocomplete="off">
          <div class="tzlist" id="tzList" role="listbox" aria-label="Time zones"></div>
          <div class="row">
            <button class="btn" id="tzLocal">Use my device zone</button>
            <button class="btn" id="tzDefault">Site default</button>
            <label class="chk"><input type="checkbox" id="tz12" style="width:auto;height:auto"> 12-hour</label>
          </div>
        </div>
      </div>
    </div>
    <button class="btn icon" id="theme" aria-label="Toggle colour theme" title="Toggle theme"><svg><use href="assets/icons.svg#i-moon"/></svg></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow"><i></i><span id="eyebrow"></span></span>
    <h1 id="heroTitle"></h1>
    <p class="lede" id="heroText"></p>
    <div class="stats" id="stats">
      <div class="stat"><b id="sTotal">—</b><span>Entries</span></div>
      <div class="stat"><b id="sTools">—</b><span id="sToolsL">Tools</span></div>
      <div class="stat"><b id="sCats">—</b><span>Categories</span></div>
      <div class="stat"><b id="sFree">—</b><span>Free / OSS</span></div>
    </div>
    <div class="notice" id="legal" hidden>
      <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
      <div><b style="color:var(--text)">Legal &amp; ethical use.</b> <span id="legalText"></span></div>
      <button id="legalX" aria-label="Dismiss notice">×</button>
    </div>
  </section>

  <div class="searchbox">
    <div class="search" id="searchWrap">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g></svg>
      <label for="q" class="sr">Search</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search…">
